name: Cric Attacks Automation

on:
  schedule:
   - cron: "0 8,9 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and push docker images
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cric_attacks .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cric_attacks_db ./postgres
          docker image ls
          docker push ${{ secrets.DOCKER_USERNAME }}/cric_attacks
          docker push ${{ secrets.DOCKER_USERNAME }}/cric_attacks_db
